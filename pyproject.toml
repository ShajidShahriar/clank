[project]
name = "clank"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "pathspec>=1.1.1",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["live: needs a running Ollama with the embedding model (run with: pytest -m live)"]
addopts = "-m 'not live'"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
norecursedirs = ["scripts", "fixtures", ".venv", "node_modules"]
